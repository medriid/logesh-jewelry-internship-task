<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 100" width="336" height="100" role="img" aria-label="Loupe">
  <title>Loupe</title>
  <defs>
    <linearGradient id="lpe-gold" x1="14%" y1="6%" x2="86%" y2="94%">
      <stop offset="0%"   stop-color="#D4B063"/>
      <stop offset="50%"  stop-color="#B08D3F"/>
      <stop offset="100%" stop-color="#7E5F22"/>
    </linearGradient>
    <style>
      .lpe-letter {
        font-family: 'Cormorant Garamond', Cormorant, Georgia, 'Times New Roman', serif;
        font-size: 68px; font-weight: 300; fill: #16130F;
      }
    </style>
  </defs>

  <text class="lpe-letter" x="40"  y="72" text-anchor="middle">L</text>

  <g transform="translate(74 21.5) scale(0.56)">
    <circle cx="50" cy="50" r="44" fill="none" stroke="#16130F" stroke-width="4.2"/>
    <circle cx="50" cy="50" r="33.5" fill="none" stroke="url(#lpe-gold)" stroke-width="3.4"/>
  </g>

  <text class="lpe-letter" x="164" y="72" text-anchor="middle">U</text>
  <text class="lpe-letter" x="226" y="72" text-anchor="middle">P</text>
  <text class="lpe-letter" x="288" y="72" text-anchor="middle">E</text>
</svg>
